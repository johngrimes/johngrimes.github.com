# Lints the page and runs the browser tests on every pull request and push to
# master.
#
# Author: John Grimes

name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
